{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">📚 Categorías de Libros</h2>

    <div class="row">
        {% for cat in categorias %}
        <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
            <div class="card h-100 border-0 shadow-sm hover-card">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="card-title fw-bold text-primary">
                        {{ cat.categoria|title }}
                    </h5>
                    <p class="text-muted mb-3">
                        {{ cat.total }} libro{{ cat.total|pluralize }}
                    </p>
                    <a href="{% url 'libros:por_categoria' cat.categoria %}" 
                       class="btn btn-outline-primary btn-sm mt-auto">
                        Ver libros
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info text-center">No se encontraron categorías.</div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .hover-card:hover {
        transform: scale(1.02);
        transition: transform 0.2s ease-in-out;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

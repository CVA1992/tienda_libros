{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">📦 Lista de Pedidos</h2>
    
    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th scope="col" class="text-center"># Pedido</th>
                    <th scope="col">Usuario</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Total</th>
                </tr>
            </thead>
            <tbody>
                {% for pedido in pedidos %}
                <tr onclick="window.location='{% url 'ventas:detalle_pedido' pedido.id %}';"
                    style="cursor: pointer;" class="hover-row">
                    <td class="text-center">{{ pedido.id }}</td>
                    <td>{{ pedido.usuario }}</td>
                    <td>
                        <span class="badge rounded-pill 
                            {% if pedido.estado == 'completado' %}bg-success
                            {% elif pedido.estado == 'pendiente' %}bg-warning text-dark
                            {% elif pedido.estado == 'cancelado' %}bg-danger
                            {% else %}bg-secondary{% endif %}">
                            {{ pedido.estado|title }}
                        </span>
                    </td>
                    <td class="text-end"><strong>${{ pedido.total|floatformat:2 }}</strong></td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">
                        No hay pedidos registrados.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<style>
    .hover-row:hover {
        background-color: rgba(0, 123, 255, 0.05);
        transition: background-color 0.2s ease-in-out;
    }
</style>
{% endblock %}
